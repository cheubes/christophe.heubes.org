{%- if page.lang == "fr" -%}
  {%- assign home = '/' -%}
  {%- assign lang_prefix = '' -%}
{%- endif -%}
{%- if page.lang == "en" -%}
  {%- assign home = '/en/' -%}
  {%- assign lang_prefix = '/en' -%}
{%- endif -%}

{%- if page.ref != "home" -%}
<header id="site-header">
  <nav class="header-icons">
    <a href="{{ lang_prefix }}/under-water" aria-label="{% if page.lang == 'fr' %}Photos sous-marines{% else %}Underwater Photos{% endif %}"><i class="fas fa-water"></i></a>
    <a href="{{ lang_prefix }}/street-art" aria-label="Street Art"><i class="fas fa-palette"></i></a>
    <a href="{{ lang_prefix }}/deambulations" aria-label="{% if page.lang == 'fr' %}Déambulations{% else %}Wanderings{% endif %}"><i class="fas fa-person-walking"></i></a>
    <a href="{{ lang_prefix }}/technical-drawing" aria-label="{% if page.lang == 'fr' %}Dessins Techniques{% else %}Technical Drawings{% endif %}"><i class="fas fa-compass-drafting"></i></a>
    <a href="https://www.samettof.org/" target="_blank" rel="noopener noreferrer" aria-label="samettof.org"><i class="fas fa-earth-asia"></i></a>
  </nav>
  <a href="{{ home }}" class="header-identity" aria-label="{% if page.lang == 'fr' %}Accueil{% else %}Home{% endif %}">
    <img class="rounded-circle" src="/assets/img/photo.jpg" alt="Christophe Heubès" />
  </a>
</header>
{%- endif -%}
